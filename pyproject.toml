[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "Organic Farm Tool"
version = "0.1.0-dev"
description = "Open-source sustainability tool for organic farms in Europe"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.10"

dependencies = [
    "pydantic>=2.0",
]
